<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Bariklana Catering &amp; Aqiqah — Dispatch Management</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .fullscreen-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
    }

    .fullscreen-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Enhanced Loading Screen Styles */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #001f3f 0%, #001f3f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }

    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      color: white;
    }

    .loading-spinner {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
    }

    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }

    .spinner-ring:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 10px;
      left: 10px;
      animation-delay: -0.3s;
      border-top-color: rgba(255, 255, 255, 0.6);
    }

    .spinner-ring:nth-child(3) {
      width: 40px;
      height: 40px;
      top: 20px;
      left: 20px;
      animation-delay: -0.6s;
      border-top-color: rgba(255, 255, 255, 0.4);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .loading-subtext {
      font-size: 14px;
      opacity: 0.8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .loading-spinner {
        width: 60px;
        height: 60px;
      }

      .loading-text {
        font-size: 20px;
      }

      .loading-subtext {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Full Screen Embedded URL -->
  <div class="fullscreen-container">
    <iframe
      class="fullscreen-iframe"
      src="https://script.google.com/macros/s/AKfycby7Jyh4N4rfQaeMGAhGEsFfRVyPAN3JbKqc_uCv1DLbPpFddZwEWJhUUdyLt0AHtM4/exec"
      frameborder="0"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      title="Bariklana Dispatch Management"
    ></iframe>
  </div>

  <!-- Enhanced Loading Screen -->
  <div class="loading-container" id="loading">
    <div class="loading-content">
      <div class="loading-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
      </div>
      <div class="loading-text">Loading...</div>
      <div class="loading-subtext">Please wait</div>
    </div>
  </div>

  <script>
    // Enhanced loading with smooth transitions
    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('loading');
      var iframe = document.querySelector('.fullscreen-iframe');

      // Function to hide loading with animation
      function hideLoading() {
        loading.classList.add('fade-out');
        setTimeout(function () {
          loading.style.display = 'none';
        }, 500);
      }

      // Hide loading when iframe loads
      iframe.onload = function () {
        hideLoading();
      };

      // Hide loading after 8 seconds even if iframe doesn't load
      setTimeout(function () {
        hideLoading();
      }, 8000);
    });
  </script>
</body>
</html>
